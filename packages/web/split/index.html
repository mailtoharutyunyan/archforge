<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archforge — split view</title>
    <meta
      name="description"
      content="Code on the left, live diagram on the right. Type architecture as code and watch the C4 view render as you go."
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../split.css" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body class="split-body">
    <div class="app split-app">
      <header class="toolbar">
        <a class="brand" href="../" title="Back to the home page">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" />
            <path d="M12 7v10M7.5 9.5v5M16.5 9.5v5" class="brand-mark-lines" />
          </svg>
          <span class="brand-name">archforge</span>
        </a>

        <div class="toolbar-group">
          <button type="button" data-action="new" title="Start from the template">New</button>
          <button type="button" data-action="example" title="Load the large example">Example</button>
          <button type="button" data-action="import" title="Open a .arch or model .json file">
            Import
          </button>
        </div>

        <div class="toolbar-group">
          <label class="select">
            Export
            <select data-action="export" aria-label="Export format">
              <option value="">Choose…</option>
              <option value="arch">Model source (.arch)</option>
              <option value="svg">Diagram SVG</option>
              <option value="png">Diagram PNG</option>
              <option value="puml">PlantUML (.puml)</option>
              <option value="mermaid">Mermaid (.mmd)</option>
              <option value="json">Model JSON</option>
              <option value="md">Markdown docs</option>
            </select>
          </label>
        </div>

        <div class="toolbar-spacer"></div>

        <div class="toolbar-group">
          <button type="button" data-action="undo" title="Undo (⌘Z)" aria-label="Undo">↶</button>
          <button type="button" data-action="redo" title="Redo (⇧⌘Z)" aria-label="Redo">↷</button>
        </div>

        <div class="toolbar-group">
          <button type="button" data-action="direction" title="Toggle layout direction">
            <span data-bind="direction">TB</span>
          </button>
          <button type="button" data-action="fit" title="Fit to viewport (F)">Fit</button>
          <button type="button" data-action="theme" title="Toggle light and dark">Theme</button>
          <a class="button-link" href="../app/" title="Open the full editor">Full editor</a>
        </div>

        <div class="status" data-bind="status" role="status" aria-live="polite"></div>
      </header>

      <!--
        Two panes, code on the left at a quarter of the width. Deliberately no
        palette, explorer or inspector: this view is for people who write the
        model and want the largest possible picture of what they just typed.
      -->
      <main class="split-main">
        <section class="split-code" aria-label="Architecture source">
          <div class="split-code-head">
            <span class="split-code-title">Source</span>
            <span class="badge" data-bind="problem-count">0</span>
            <span class="badge" data-bind="violation-count">0</span>
            <div class="toolbar-spacer"></div>
            <select data-bind="source-view" aria-label="Show">
              <option value="source">.arch</option>
              <option value="puml">PlantUML</option>
              <option value="mermaid">Mermaid</option>
              <option value="json">Model JSON</option>
            </select>
          </div>

          <div class="code-editor split-editor">
            <div class="gutter" data-bind="gutter" aria-hidden="true"></div>
            <div class="code-scroll" data-bind="code-scroll">
              <pre class="highlight" data-bind="highlight" aria-hidden="true"></pre>
              <textarea
                class="code-input"
                data-bind="code"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                wrap="off"
                aria-label="Architecture source"
              ></textarea>
            </div>
          </div>

          <pre class="generated split-generated" data-bind="generated" hidden></pre>

          <div class="split-problems" data-bind="problems-strip"></div>
        </section>

        <div class="split-divider" data-bind="split-divider" role="separator"
             aria-orientation="vertical" aria-label="Resize the code pane" tabindex="0"></div>

        <section class="split-canvas-area" aria-label="Diagram">
          <nav class="view-tabs" data-bind="tabs" aria-label="Views"></nav>
          <div class="canvas" data-bind="canvas" tabindex="0">
            <div class="canvas-viewport" data-bind="viewport"></div>
            <div class="canvas-hint" data-bind="hint"></div>
          </div>
          <div class="zoom-controls">
            <button type="button" data-action="zoom-out" aria-label="Zoom out">−</button>
            <span data-bind="zoom">100%</span>
            <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
            <button type="button" data-action="reset-pins" title="Clear manual positions">
              Reset layout
            </button>
          </div>
        </section>
      </main>
    </div>

    <input type="file" data-bind="file-input" accept=".arch,.af,.json,.puml,.plantuml,.iuml,.wsd" hidden />

    <script type="module" src="../js/web/src/split.js"></script>
    <noscript>
      <p style="padding: 2rem; font: 14px system-ui">
        The Archforge split view runs entirely in your browser and needs JavaScript enabled.
      </p>
    </noscript>
  </body>
</html>
